<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمس | للشحن والتوصيل السريع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, #1a233a 0%, #0b0f19 70%);
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .logo-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #f3f4f6;
            letter-spacing: 0.5px;
        }
        p.subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 25px;
        }
        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 14px;
        }
        .feature-item {
            font-size: 12px;
            color: #d1d5db;
        }
        .feature-item span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #f59e0b;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #d1d5db;
            line-height: 1.6;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">☀️</div>
        <h1>شمس للشحن والتوصيل</h1>
        <p class="subtitle">خدمات النقل والترحال والتوصيل السريع</p>

        <div class="features">
            <div class="feature-item"><span>⚡</span> سرعة بالأداء</div>
            <div class="feature-item"><span>🛡️</span> أمان وموثوقية</div>
            <div class="feature-item"><span>📍</span> تغطية شاملة</div>
        </div>

        <div class="info-box">
            أهلاً بكم في منصة شمس الرسمية. الموقع الأساسي جاهز لعرض الخدمات والتعريف بنشاط الشحن والنقل الخاص بنا بكل سلاسة ووضوح.
        </div>

        <div class="footer">
            جميع الحقوق محفوظة © شمس 2026
        </div>
    </div>

</body>
</html>
