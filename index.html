<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمس - للتوصيل والنقل السريع | درعا</title>
    <style>
        :root {
            --bg-dark: #0f0f11;
            --card-bg: #18181c;
            --primary-gold: #d4af37;
            --gold-hover: #f1c40f;
            --whatsapp-green: #25d366;
            --text-white: #ffffff;
            --text-muted: #a0a0aa;
            --border-color: #2a2a32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.6;
            padding: 20px 0 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* البطاقات الرئيسية */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
        }

        .header-card {
            text-align: center;
            padding: 25px 20px;
        }

        .header-card h1 {
            color: var(--primary-gold);
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .header-card p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-title {
            color: var(--primary-gold);
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* أدوات التحكم في النموذج */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #101014;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-gold);
        }

        /* الأزرار */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-wa {
            background-color: var(--whatsapp-green);
            color: #fff;
        }
        .btn-wa:hover { background-color: #20ba5a; }

        .btn-call {
            background-color: var(--primary-gold);
            color: #111;
        }
        .btn-call:hover { background-color: var(--gold-hover); }

        .btn-sec {
            background-color: #24242c;
            color: var(--text-white);
        }
        .btn-sec:hover { background-color: #30303a; }

        /* تتبع الشحنة */
        .tracking-result {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #101014;
            border-right: 3px solid var(--primary-gold);
            border-radius: 6px;
            font-size: 13px;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الترويسة الرئيسية -->
        <div class="card header-card">
            <h1>☀️ شمس</h1>
            <p>خدمات التوصيل والنقل السريع - درعا، سوريا</p>
        </div>

        <!-- نموذج إرسال الطلب -->
        <div class="card">
            <div class="section-title">📦 طلب خدمة توصيل</div>
            <div class="form-group">
                <label>اسمك الكريم / المستلم:</label>
                <input type="text" id="custName" placeholder="أدخل اسمك هنا">
            </div>
            <div class="form-group">
                <label>رقم للتواصل:</label>
                <input type="tel" id="custPhone" placeholder="09xxxxxxxx">
            </div>
            <div class="form-group">
                <label>تفاصيل الطلب والعنوان:</label>
                <textarea id="custDetails" rows="3" placeholder="أدخل مكان الاستلام والتسليم ونوع الطرد..."></textarea>
            </div>
            <button class="btn btn-wa" onclick="sendOrder()">💬 إرسال الطلب عبر الواتساب</button>
        </div>

        <!-- تتبع حالة الشحنة -->
        <div class="card">
            <div class="section-title">🔍 تتبع حالة شحنة</div>
            <div class="form-group">
                <label>رقم الطلب / الشحنة:</label>
                <input type="text" id="trackId" placeholder="أدخل رقم الشحنة (مثال: 1001)">
            </div>
            <button class="btn btn-sec" onclick="track()">بحث عن الشحنة</button>
            <div class="tracking-result" id="trackResult"></div>
        </div>

        <!-- أرقام الاتصال المباشر -->
        <div class="card">
            <div class="section-title">📞 تواصل معنا مباشرة</div>
            <a href="https://wa.me/963997973734" class="btn btn-wa" target="_blank">💬 مراسلة الواتساب (0997973734)</a>
            <a href="tel:0934964138" class="btn btn-call">📞 الاتصال المباشر (0934964138)</a>
        </div>

        <footer>
            جميع الحقوق محفوظة © شمس للتوصيل السريع 2026
        </footer>
    </div>

    <script>
        function sendOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const details = document.getElementById('custDetails').value.trim();

            if(!name || !phone || !details) {
                alert('الرجاء تعبئة الاسم ورقم الهاتف وتفاصيل الطلب أولاً.');
                return;
            }

            const msg = `مرحباً، أود إرسال طلب توصيل جديد:\n\n` +
                        `👤 الاسم: ${name}\n` +
                        `📞 الرقم: ${phone}\n` +
                        `📝 التفاصيل والعنوان: ${details}`;

            window.open(`https://wa.me/963997973734?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function track() {
            const id = document.getElementById('trackId').value.trim();
            const res = document.getElementById('trackResult');
            if(!id) {
                alert('يرجى كتابة رقم الشحنة أولاً.');
                return;
            }
            res.style.display = 'block';
            res.innerHTML = `📍 الشحنة <b>#${id}</b>: الطلب مقبول ومسند لمندوب التوصيل في منطقة درعا.`;
        }
    </script>
</body>
</html>
