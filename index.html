<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمس | للشحن والتوصيل السريع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, #1a233a 0%, #0b0f19 70%);
            overflow: hidden;
        }

        /* --- شاشة الترحيب والتحميل (Splash Screen) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);
            margin-bottom: 20px;
            animation: pulse 1.8s infinite ease-in-out;
        }

        .splash-title {
            font-size: 28px;
            font-weight: bold;
            color: #f3f4f6;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* خط التحميل المتحرك */
        .progress-bar-container {
            width: 180px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 10px;
            animation: load 2.2s forwards ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes load {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        /* --- محتوى الموقع الرئيسي --- */
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* يظهر المحتوى بعد اختفاء التحميل */
        body.loaded .container {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded #splash-screen {
            opacity: 0;
            visibility: hidden;
        }

        .main-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 6px;
            color: #f3f4f6;
        }

        p.subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 22px;
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 22px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 14px;
        }

        .feature-item {
            font-size: 12px;
            color: #d1d5db;
        }

        .feature-item span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #f59e0b;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.5);
        }

        .footer {
            margin-top: 18px;
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <!-- شاشة الترحيب بالشعار والخط المتحرك -->
    <div id="splash-screen">
        <div class="splash-logo">☀️</div>
        <div class="splash-title">تطبيق شمس</div>
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- كارت التطبيق الرئيسي -->
    <div class="container">
        <div class="main-logo">☀️</div>
        <h1>شمس للشحن والتوصيل</h1>
        <p class="subtitle">خدمات التخدييم والتوصيل السريع والنقل</p>

        <div class="features">
            <div class="feature-item"><span>⚡</span> سرعة بالتوصيل</div>
            <div class="feature-item"><span>🛡️</span> أمان وموثوقية</div>
            <div class="feature-item"><span>📍</span> تغطية شاملة</div>
        </div>

        <a href="https://wa.me/?text=مرحباً،%20أريد%20طلب%20خدمة%20توصيل%20من%20تطبيق%20شمس" class="btn btn-whatsapp" target="_blank">
            💬 اطلب الآن عبر الواتساب
        </a>

        <div class="footer">
            جميع الحقوق محفوظة © شمس 2026
        </div>
    </div>

    <script>
        // كود التحكم بزمن شاشة الترحيب (تختفي بعد 2.4 ثانية)
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
                document.body.style.overflow = 'auto';
            }, 2400);
        });
    </script>
</body>
</html>
